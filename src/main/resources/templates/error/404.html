<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: layout('Không tìm thấy trang', ~{::content})}">
<body>
<div th:fragment="content" class="error-card card" style="text-align: center; max-width: 480px; margin: auto; padding: var(--space-8) var(--space-6);">
    <div class="error-card__icon-wrapper" style="margin-bottom: var(--space-4); color: var(--primary);">
        <svg class="icon" style="width: 64px; height: 64px;" aria-hidden="true"><use href="#icon-search"/></svg>
    </div>
    <h1 class="auth-card__title" style="margin-bottom: var(--space-2);">404 - Không tìm thấy trang</h1>
    <p style="color: var(--text-muted); margin-bottom: var(--space-6);">Đường dẫn không tồn tại hoặc đã được chuyển sang địa chỉ khác.</p>
    <div>
        <a th:href="@{/}" class="btn btn--primary" style="display: inline-flex; align-items: center; gap: var(--space-2);">
            <svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>
            <span>Về trang chủ</span>
        </a>
    </div>
</div>
</body>
</html>
