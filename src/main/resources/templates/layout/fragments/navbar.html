<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Thanh header cho sinh vien (desktop va mobile) -->
<header th:fragment="studentNavbar" class="navbar">
    <div class="navbar__container">
        <a th:href="@{/}" class="navbar__brand">StudyMate</a>

        <!-- Menu ngang tren desktop -->
        <ul class="navbar__nav">
            <li th:each="item : ${menuItems}" th:if="${item.showOnDesktop}">
                <a th:href="@{${item.url}}" class="navbar__link" th:text="${item.label}"></a>
            </li>
        </ul>

        <div class="navbar__actions">
            <!-- Thong bao (icon chuong tren mobile va desktop) -->
            <a th:href="@{/notifications}" class="navbar__bell" aria-label="Thông báo">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </a>

            <!-- Bo chuyen chu de sang/toi -->
            <div class="theme-switcher" role="group" aria-label="Chủ đề giao diện">
                <button type="button" class="theme-switcher__btn" data-theme-value="light" aria-pressed="true">Sáng</button>
                <button type="button" class="theme-switcher__btn" data-theme-value="dark" aria-pressed="false">Tối</button>
                <button type="button" class="theme-switcher__btn" data-theme-value="system" aria-pressed="false">Hệ thống</button>
            </div>

            <!-- Nut dang xuat bang form POST (co CSRF) -->
            <form th:if="${currentUser != null}" th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn--secondary btn--sm">Đăng xuất</button>
            </form>
        </div>
    </div>
</header>

<!-- Thanh tab duoi cho sinh vien tren mobile -->
<nav th:fragment="studentBottomNav" class="nav-bottom" aria-label="Điều hướng chính">
    <th:block th:each="item : ${menuItems}" th:if="${item.showOnMobileBottom}">
        <a th:href="@{${item.url}}" class="nav-bottom__item">
            <!-- Icon Tim ban -->
            <svg th:if="${item.icon == 'magnifying-glass'}" class="nav-bottom__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <!-- Icon Nhom -->
            <svg th:if="${item.icon == 'users'}" class="nav-bottom__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <!-- Icon Dat phong -->
            <svg th:if="${item.icon == 'calendar-blank'}" class="nav-bottom__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <!-- Icon Chat -->
            <svg th:if="${item.icon == 'chat-circle'}" class="nav-bottom__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
            <!-- Icon Ho so -->
            <svg th:if="${item.icon == 'user-circle'}" class="nav-bottom__icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="10" r="3"></circle>
                <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
            </svg>
            <span th:text="${item.label}"></span>
        </a>
    </th:block>
</nav>

<!-- Thanh sidebar cho quan ly va admin -->
<aside th:fragment="staffSidebar" class="sidebar">
    <a th:href="@{/}" class="sidebar__brand">StudyMate</a>

    <ul class="sidebar__menu">
        <li th:each="item : ${menuItems}">
            <a th:href="@{${item.url}}" class="sidebar__link">
                <!-- Icon Door / Calendar / List / Users -->
                <svg th:if="${item.icon == 'calendar-blank'}" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <svg th:if="${item.icon == 'check'}" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <svg th:if="${item.icon == 'list'}" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <svg th:if="${item.icon == 'users'}" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span th:text="${item.label}"></span>
            </a>
        </li>
    </ul>

    <div class="sidebar__footer">
        <div class="theme-switcher" role="group" aria-label="Chủ đề giao diện">
            <button type="button" class="theme-switcher__btn" data-theme-value="light" aria-pressed="true">Sáng</button>
            <button type="button" class="theme-switcher__btn" data-theme-value="dark" aria-pressed="false">Tối</button>
            <button type="button" class="theme-switcher__btn" data-theme-value="system" aria-pressed="false">Hệ thống</button>
        </div>

        <div th:if="${currentUser != null}">
            <p style="font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text);" th:text="${currentUser.fullName}"></p>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--secondary btn--sm btn--block">Đăng xuất</button>
        </form>
    </div>
</aside>

</body>
</html>
