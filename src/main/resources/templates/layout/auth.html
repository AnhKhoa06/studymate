<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head th:replace="~{layout/fragments/head :: head(${title})}"></head>
<body class="layout-auth">
    <header class="layout-auth__header">
        <a th:href="@{/}" class="layout-auth__brand">StudyMate</a>
        <div class="theme-switcher" role="group" aria-label="Chủ đề giao diện">
            <button type="button" class="theme-switcher__btn" data-theme-value="light" aria-pressed="true">Sáng</button>
            <button type="button" class="theme-switcher__btn" data-theme-value="dark" aria-pressed="false">Tối</button>
            <button type="button" class="theme-switcher__btn" data-theme-value="system" aria-pressed="false">Hệ thống</button>
        </div>
    </header>
    <main class="layout-auth__main">
        <th:block th:replace="${content}"></th:block>
    </main>
    <footer th:replace="~{layout/fragments/footer :: footer}"></footer>
</body>
</html>
