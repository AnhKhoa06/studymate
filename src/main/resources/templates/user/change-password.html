<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="${currentRole == 'MANAGER' or currentRole == 'ADMIN'} ? ~{layout/staff :: layout('Đổi mật khẩu', ~{::content})} : ~{layout/student :: layout('Đổi mật khẩu', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="profile-header">
        <div>
            <h1 class="page-title" style="margin-bottom: var(--space-1); border-bottom: none; padding-bottom: 0;">Đổi mật khẩu</h1>
            <p class="profile-subtitle">Cập nhật mật khẩu mới để bảo vệ tài khoản của bạn.</p>
        </div>
    </div>

    <section class="card profile-section" style="max-width: 560px;">
        <form th:action="@{/change-password}" th:object="${changePasswordForm}" method="post" class="profile-form">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert--danger" role="alert">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="currentPassword">Mật khẩu hiện tại <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input class="form-field__input input-with-toggle" type="password" id="currentPassword" name="currentPassword"
                           th:aria-invalid="${#fields.hasErrors('currentPassword')}" required placeholder="Nhập mật khẩu hiện tại">
                    <button type="button" class="btn-toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                        <svg class="icon icon-eye-show" aria-hidden="true"><use href="#icon-eye"/></svg>
                        <svg class="icon icon-eye-hide" aria-hidden="true" style="display:none;"><use href="#icon-eye-slash"/></svg>
                    </button>
                </div>
                <p class="form-field__error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="newPassword">Mật khẩu mới <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input class="form-field__input input-with-toggle" type="password" id="newPassword" name="newPassword"
                           th:aria-invalid="${#fields.hasErrors('newPassword')}" required minlength="8" placeholder="Tối thiểu 8 ký tự">
                    <button type="button" class="btn-toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                        <svg class="icon icon-eye-show" aria-hidden="true"><use href="#icon-eye"/></svg>
                        <svg class="icon icon-eye-hide" aria-hidden="true" style="display:none;"><use href="#icon-eye-slash"/></svg>
                    </button>
                </div>
                <p class="form-field__error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="confirmPassword">Nhập lại mật khẩu mới <span class="required">*</span></label>
                <div class="input-wrapper">
                    <input class="form-field__input input-with-toggle" type="password" id="confirmPassword" name="confirmPassword"
                           th:aria-invalid="${#fields.hasErrors('confirmPassword')}" required minlength="8" placeholder="Nhập lại mật khẩu mới">
                    <button type="button" class="btn-toggle-password" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
                        <svg class="icon icon-eye-show" aria-hidden="true"><use href="#icon-eye"/></svg>
                        <svg class="icon icon-eye-hide" aria-hidden="true" style="display:none;"><use href="#icon-eye-slash"/></svg>
                    </button>
                </div>
                <p class="form-field__error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-2);">
                <a th:href="@{/profile}" class="btn btn--secondary">Quay lại</a>
                <button type="submit" class="btn btn--primary">Cập nhật mật khẩu</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
