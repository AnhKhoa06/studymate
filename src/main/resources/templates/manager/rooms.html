<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('Quản lý phòng học', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="admin-header">
        <div>
            <h2 class="admin-header__title">Danh sách phòng học</h2>
            <p class="admin-header__subtitle" th:text="|Tổng cộng ${roomsPage.totalElements} phòng học|"></p>
        </div>
        <a th:href="@{/manager/rooms/new}" class="btn btn--primary">+ Thêm phòng</a>
    </div>

    <!-- Thanh tim kiem va loc phong -->
    <form th:action="@{/manager/rooms}" method="get" class="card filter-bar">
        <div class="filter-bar__fields">
            <div class="form-field filter-bar__search">
                <label class="form-field__label" for="searchKeyword">Tìm kiếm</label>
                <input class="form-field__input" type="text" id="searchKeyword" name="q"
                       th:value="${keyword}" placeholder="Mã phòng, tòa nhà hoặc thiết bị...">
            </div>

            <div class="form-field">
                <label class="form-field__label" for="filterBuilding">Tòa nhà</label>
                <select class="form-field__input" id="filterBuilding" name="building">
                    <option value="">Tất cả tòa</option>
                    <option th:each="b : ${buildings}" th:value="${b}" th:text="${b}"
                            th:selected="${selectedBuilding == b}"></option>
                </select>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="filterStatus">Trạng thái</label>
                <select class="form-field__input" id="filterStatus" name="status">
                    <option value="">Tất cả</option>
                    <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.displayName}"
                            th:selected="${selectedStatus == s}"></option>
                </select>
            </div>
        </div>

        <div class="filter-bar__actions">
            <button type="submit" class="btn btn--primary btn--sm">Lọc</button>
            <a th:href="@{/manager/rooms}" class="btn btn--secondary btn--sm">Đặt lại</a>
        </div>
    </form>

    <!-- Bang danh sach phong -->
    <div class="card data-table-card">
        <div class="data-table-wrap" th:if="${!roomsPage.isEmpty()}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Mã phòng</th>
                        <th>Tòa nhà</th>
                        <th>Sức chứa</th>
                        <th>Thiết bị</th>
                        <th>Trạng thái</th>
                        <th class="data-table__col-actions">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="room : ${roomsPage.content}">
                        <td th:text="${room.code}"></td>
                        <td th:text="${room.building}"></td>
                        <td th:text="|${room.capacity} chỗ|"></td>
                        <td th:text="${#strings.isEmpty(room.equipment) ? 'Không có' : room.equipment}"></td>
                        <td>
                            <span class="status-pill"
                                  th:classappend="${room.status.name() == 'AVAILABLE' ? ' status-pill--active' : ' status-pill--locked'}"
                                  th:text="${room.status.displayName}"></span>
                        </td>
                        <td class="data-table__col-actions">
                            <div class="table-actions">
                                <a th:href="@{/manager/rooms/{id}/edit(id=${room.id})}"
                                   class="btn btn--secondary btn--sm">Sửa</a>

                                <form th:action="@{/manager/rooms/{id}/status(id=${room.id})}" method="post" class="inline-form">
                                    <input type="hidden" name="q" th:value="${keyword}">
                                    <input type="hidden" name="building" th:value="${selectedBuilding}">
                                    <input type="hidden" name="status" th:value="${selectedStatus != null ? selectedStatus.name() : ''}">
                                    <input type="hidden" name="page" th:value="${roomsPage.number}">
                                    <select class="form-field__input form-field__input--compact" name="newStatus" aria-label="Chọn trạng thái mới">
                                        <option th:each="s : ${statuses}" th:value="${s.name()}"
                                                th:text="${s.displayName}"
                                                th:selected="${room.status == s}"></option>
                                    </select>
                                    <button type="submit" class="btn btn--secondary btn--sm">Cập nhật</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${roomsPage.isEmpty()}">
            <p class="empty-state__title">Chưa có phòng học phù hợp</p>
            <p class="empty-state__desc">Thử đổi từ khóa tìm kiếm hoặc thêm phòng học mới.</p>
        </div>

        <!-- Phan trang -->
        <div class="pagination" th:if="${roomsPage.totalPages > 1}">
            <a class="btn btn--secondary btn--sm"
               th:if="${roomsPage.hasPrevious()}"
               th:href="@{/manager/rooms(q=${keyword}, building=${selectedBuilding}, status=${selectedStatus}, page=${roomsPage.number - 1})}">Trước</a>
            <span class="pagination__info" th:text="|Trang ${roomsPage.number + 1} / ${roomsPage.totalPages}|"></span>
            <a class="btn btn--secondary btn--sm"
               th:if="${roomsPage.hasNext()}"
               th:href="@{/manager/rooms(q=${keyword}, building=${selectedBuilding}, status=${selectedStatus}, page=${roomsPage.number + 1})}">Sau</a>
        </div>
    </div>
</div>
</body>
</html>
