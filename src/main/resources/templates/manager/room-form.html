<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout(${pageTitle}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="admin-header">
        <div>
            <h2 class="admin-header__title" th:text="${pageTitle}">Phòng học</h2>
        </div>
        <a th:href="@{/manager/rooms}" class="btn btn--secondary">Quay lại danh sách</a>
    </div>

    <div class="card">
        <form th:action="@{${formAction}}" th:object="${roomForm}" method="post" class="modal-card__form">
            <div class="form-field">
                <label class="form-field__label" for="roomCode">Mã phòng <span class="required">*</span></label>
                <input class="form-field__input" type="text" id="roomCode" th:field="*{code}"
                       required maxlength="30" placeholder="Ví dụ: B1-201">
                <p class="form-field__error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="roomBuilding">Tòa nhà <span class="required">*</span></label>
                <input class="form-field__input" type="text" id="roomBuilding" th:field="*{building}"
                       required maxlength="50" placeholder="Ví dụ: B1">
                <p class="form-field__error" th:if="${#fields.hasErrors('building')}" th:errors="*{building}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="roomCapacity">Sức chứa <span class="required">*</span></label>
                <input class="form-field__input" type="number" id="roomCapacity" th:field="*{capacity}"
                       required min="1" max="500" placeholder="Ví dụ: 12">
                <p class="form-field__error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="roomEquipment">Thiết bị</label>
                <input class="form-field__input" type="text" id="roomEquipment" th:field="*{equipment}"
                       maxlength="255" placeholder="Máy chiếu, bảng trắng, ổ cắm">
                <p class="form-field__error" th:if="${#fields.hasErrors('equipment')}" th:errors="*{equipment}"></p>
            </div>

            <div class="form-field">
                <label class="form-field__label" for="roomStatus">Trạng thái <span class="required">*</span></label>
                <select class="form-field__input" id="roomStatus" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.displayName}"></option>
                </select>
                <p class="form-field__error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></p>
            </div>

            <div class="modal-card__actions">
                <a th:href="@{/manager/rooms}" class="btn btn--secondary">Hủy</a>
                <button type="submit" class="btn btn--primary"
                        th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo phòng'}"></button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
