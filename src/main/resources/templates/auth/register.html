<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - StudyMate</title>
</head>
<body>
<h1>Đăng ký tài khoản</h1>

<form th:action="@{/register}" th:object="${registerRequest}" method="post">
    <!-- CSRF tự động thêm bởi Thymeleaf khi dùng th:action -->

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <!-- Hiển thị lỗi validation từng trường, dùng th:text để tránh XSS -->
        <span th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></span>
    </div>

    <div>
        <label for="fullName">Họ và tên</label>
        <input type="text" id="fullName" th:field="*{fullName}" required maxlength="100">
        <span th:if="${#fields.hasErrors('fullName')}" th:text="${#fields.errors('fullName')[0]}"></span>
    </div>

    <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" th:field="*{password}" required minlength="8">
        <span th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></span>
    </div>

    <div>
        <label for="confirmPassword">Nhập lại mật khẩu</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
        <span th:if="${#fields.hasErrors('confirmPassword')}" th:text="${#fields.errors('confirmPassword')[0]}"></span>
    </div>

    <button type="submit">Đăng ký</button>
</form>

<p><a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a></p>
</body>
</html>
