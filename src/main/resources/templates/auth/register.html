<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: layout('Đăng ký tài khoản', ~{::content})}">
<body>
<div th:fragment="content" class="auth-card">
    <h1 class="auth-card__title">Đăng ký tài khoản</h1>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="form-field">
            <label class="form-field__label" for="email">Email</label>
            <input class="form-field__input" type="email" id="email" th:field="*{email}"
                   th:aria-invalid="${#fields.hasErrors('email')}" required>
            <span class="form-field__error" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></span>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="fullName">Họ và tên</label>
            <input class="form-field__input" type="text" id="fullName" th:field="*{fullName}"
                   th:aria-invalid="${#fields.hasErrors('fullName')}" required maxlength="100">
            <span class="form-field__error" th:if="${#fields.hasErrors('fullName')}" th:text="${#fields.errors('fullName')[0]}"></span>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="password">Mật khẩu</label>
            <!-- Khong dung th:field de tranh dien lai mat khau khi loi -->
            <input class="form-field__input" type="password" id="password" name="password"
                   th:aria-invalid="${#fields.hasErrors('password')}" required minlength="8">
            <span class="form-field__error" th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></span>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="confirmPassword">Nhập lại mật khẩu</label>
            <input class="form-field__input" type="password" id="confirmPassword" name="confirmPassword"
                   th:aria-invalid="${#fields.hasErrors('confirmPassword')}" required>
            <span class="form-field__error" th:if="${#fields.hasErrors('confirmPassword')}" th:text="${#fields.errors('confirmPassword')[0]}"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Đăng ký</button>
    </form>

    <p style="text-align: center; font-size: var(--text-sm);">
        <a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a>
    </p>
</div>
</body>
</html>
