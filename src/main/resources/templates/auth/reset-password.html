<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: layout('Đặt lại mật khẩu', ~{::content})}">
<body>
<div th:fragment="content" class="auth-card">
    <h1 class="auth-card__title">ĐẶT LẠI MẬT KHẨU</h1>

    <div th:if="${!tokenValid}" class="alert alert--error" role="alert">
        <svg class="icon alert__icon" aria-hidden="true"><use href="#icon-warning"/></svg>
        <span>Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</span>
    </div>

    <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${resetForm}" method="post" class="auth-form">
        <input type="hidden" th:field="*{token}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert--error" role="alert">
            <svg class="icon alert__icon" aria-hidden="true"><use href="#icon-warning"/></svg>
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="newPassword">Mật khẩu mới</label>
            <input class="form-field__input" type="password" id="newPassword" th:field="*{newPassword}"
                   required minlength="8" placeholder="Tối thiểu 8 ký tự">
            <p class="form-field__error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input class="form-field__input" type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   required minlength="8" placeholder="Nhập lại mật khẩu">
            <p class="form-field__error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Cập nhật mật khẩu</button>
    </form>

    <p class="auth-card__switch">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </p>
</div>
</body>
</html>
