<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: layout('Đăng nhập', ~{::content})}">
<body>
<div th:fragment="content" class="auth-card">
    <h1 class="auth-card__title">Đăng nhập</h1>

    <!-- Thong bao co dinh theo quy uoc, khong doi text vi test kiem tra dung cau nay -->
    <div th:if="${param.error}" class="alert alert--error" role="alert">
        <p>Thông tin đăng nhập không chính xác. Vui lòng thử lại.</p>
    </div>
    <div th:if="${param.logout}" class="alert alert--success" role="status">
        <p>Đã đăng xuất thành công.</p>
    </div>
    <div th:if="${param.registered}" class="alert alert--success" role="status">
        <p>Đăng ký thành công. Vui lòng đăng nhập.</p>
    </div>

    <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: var(--space-4);">
        <div class="form-field">
            <label class="form-field__label" for="username">Email</label>
            <input class="form-field__input" type="email" id="username" name="username" required autofocus>
        </div>

        <div class="form-field">
            <label class="form-field__label" for="password">Mật khẩu</label>
            <input class="form-field__input" type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Đăng nhập</button>
    </form>

    <p style="text-align: center; font-size: var(--text-sm);">
        <a th:href="@{/register}">Chưa có tài khoản? Đăng ký</a>
    </p>
</div>
</body>
</html>
