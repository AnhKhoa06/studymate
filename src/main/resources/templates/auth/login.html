<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - StudyMate</title>
</head>
<body>
<h1>Đăng nhập</h1>

<!-- Thông báo lỗi chung chung, không tiết lộ email có tồn tại hay không -->
<div th:if="${param.error}">
    <p>Thông tin đăng nhập không chính xác. Vui lòng thử lại.</p>
</div>
<div th:if="${param.logout}">
    <p>Đã đăng xuất thành công.</p>
</div>
<div th:if="${param.registered}">
    <p>Đăng ký thành công. Vui lòng đăng nhập.</p>
</div>

<form th:action="@{/login}" method="post">
    <!-- CSRF tự động thêm bởi Thymeleaf khi dùng th:action -->
    <div>
        <label for="username">Email</label>
        <input type="email" id="username" name="username" required autofocus>
    </div>
    <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Đăng nhập</button>
</form>

<p><a th:href="@{/register}">Chưa có tài khoản? Đăng ký</a></p>
</body>
</html>
