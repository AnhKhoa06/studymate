<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: layout('Quên mật khẩu', ~{::content})}">
<body>
<div th:fragment="content" class="auth-card">
    <h1 class="auth-card__title">QUÊN MẬT KHẨU</h1>

    <div th:if="${infoMessage}" class="alert alert--success" role="status">
        <svg class="icon alert__icon" aria-hidden="true"><use href="#icon-check"/></svg>
        <span th:text="${infoMessage}"></span>
    </div>

    <form th:action="@{/forgot-password}" th:object="${forgotForm}" method="post" class="auth-form">
        <div class="form-field">
            <label class="form-field__label" for="email">Email tài khoản</label>
            <input class="form-field__input" type="email" id="email" th:field="*{email}"
                   required autofocus autocomplete="email" placeholder="email@example.com">
            <p class="form-field__error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Gửi liên kết đặt lại</button>
    </form>

    <p class="auth-card__switch">
        <a th:href="@{/login}">Quay lại đăng nhập</a>
    </p>
</div>
</body>
</html>
