<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/student :: layout('Trang chủ', ~{::content})}">
<body>
<div th:fragment="content">
    <h1 class="page-title">Trang chủ StudyMate</h1>

    <div class="card">
        <p>Xin chào, <strong th:text="${fullName}"></strong></p>
        <p>Vai trò: <span th:text="${role}"></span></p>
    </div>

    <div style="margin-top: var(--space-4);">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--secondary">Đăng xuất</button>
        </form>
    </div>
</div>
</body>
</html>
