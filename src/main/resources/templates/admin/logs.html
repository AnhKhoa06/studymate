<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/staff :: layout('Nhật ký hoạt động', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="admin-header">
        <div>
            <h2 class="admin-header__title">Nhật ký hoạt động hệ thống</h2>
            <p class="admin-header__subtitle" th:text="|Tổng cộng ${logsPage.totalElements} bản ghi|"></p>
        </div>
    </div>

    <form th:action="@{/admin/logs}" method="get" class="card filter-bar">
        <div class="filter-bar__fields">
            <div class="form-field filter-bar__search">
                <label class="form-field__label" for="logKeyword">Tìm kiếm</label>
                <input class="form-field__input" type="text" id="logKeyword" name="q"
                       th:value="${keyword}" placeholder="Email hoặc chi tiết sự kiện...">
            </div>

            <div class="form-field">
                <label class="form-field__label" for="logAction">Loại sự kiện</label>
                <select class="form-field__input" id="logAction" name="action">
                    <option value="">Tất cả sự kiện</option>
                    <option th:each="act : ${actions}" th:value="${act}" th:text="${act}"
                            th:selected="${selectedAction == act}"></option>
                </select>
            </div>
        </div>

        <div class="filter-bar__actions">
            <button type="submit" class="btn btn--primary btn--sm">Lọc</button>
            <a th:href="@{/admin/logs}" class="btn btn--secondary btn--sm">Đặt lại</a>
        </div>
    </form>

    <div class="card data-table-card">
        <div class="data-table-wrap" th:if="${!logsPage.isEmpty()}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Email liên quan</th>
                        <th>Hành động</th>
                        <th>Chi tiết</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${logsPage.content}">
                        <td class="text-muted" th:text="${#temporals.format(entry.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td th:text="${entry.actorEmail != null ? entry.actorEmail : '-'}"></td>
                        <td>
                            <span class="badge badge--primary" th:text="${entry.action}"></span>
                        </td>
                        <td th:text="${entry.detail}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${logsPage.isEmpty()}">
            <svg class="icon empty-state__icon" aria-hidden="true"><use href="#icon-clock"/></svg>
            <p class="empty-state__title">Chưa có bản ghi nhật ký nào</p>
            <p class="empty-state__desc">Các sự kiện đăng nhập, khóa tài khoản và đổi vai trò sẽ được ghi lại tại đây.</p>
        </div>

        <div class="pagination" th:if="${logsPage.totalPages > 1}">
            <a class="btn btn--secondary btn--sm"
               th:if="${logsPage.hasPrevious()}"
               th:href="@{/admin/logs(q=${keyword}, action=${selectedAction}, page=${logsPage.number - 1})}">Trước</a>
            <span class="pagination__info" th:text="|Trang ${logsPage.number + 1} / ${logsPage.totalPages}|"></span>
            <a class="btn btn--secondary btn--sm"
               th:if="${logsPage.hasNext()}"
               th:href="@{/admin/logs(q=${keyword}, action=${selectedAction}, page=${logsPage.number + 1})}">Sau</a>
        </div>
    </div>
</div>
</body>
</html>
